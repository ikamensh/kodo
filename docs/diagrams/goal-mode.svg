<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" /><stop offset="100%" style="stop-color:#4f46e5" />
    </linearGradient>
    <linearGradient id="darkPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81" /><stop offset="100%" style="stop-color:#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4" /><stop offset="100%" style="stop-color:#0891b2" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316" /><stop offset="100%" style="stop-color:#ea580c" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#6366f1">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#475569">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#06b6d4">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="960" height="820" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">Goal Mode</text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">kodo --goal "Add auth middleware to all API routes"</text>

  <!-- ===== STEP 1: INTAKE ===== -->
  <rect x="30" y="80" width="900" height="120" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="100" fill="#a5b4fc" font-size="12" font-weight="700">1  INTAKE / PLANNING</text>

  <rect x="60" y="112" width="180" height="70" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="150" y="138" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">User Goal</text>
  <text x="150" y="156" text-anchor="middle" fill="#818cf8" font-size="10" font-family="monospace">"Add auth middleware"</text>
  <text x="150" y="172" text-anchor="middle" fill="#64748b" font-size="9">--goal / --goal-file / chat</text>

  <line x1="240" y1="147" x2="310" y2="147" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="112" width="220" height="70" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="420" y="133" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">Planning LLM</text>
  <text x="420" y="150" text-anchor="middle" fill="#818cf8" font-size="10">Gemini Flash / cheap model</text>
  <text x="420" y="167" text-anchor="middle" fill="#64748b" font-size="9">Reads codebase, decomposes goal</text>

  <line x1="530" y1="147" x2="600" y2="147" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="112" width="300" height="70" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="750" y="133" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">goal-plan.json</text>
  <text x="750" y="150" text-anchor="middle" fill="#818cf8" font-size="10" font-family="monospace">context + stages[]</text>
  <text x="750" y="167" text-anchor="middle" fill="#64748b" font-size="9">{name, description, acceptance_criteria, parallel_group}</text>

  <!-- ===== STEP 2: TEAM ===== -->
  <rect x="30" y="215" width="900" height="100" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="235" fill="#a5b4fc" font-size="12" font-weight="700">2  TEAM ASSEMBLY</text>
  <text x="255" y="235" fill="#64748b" font-size="10">Auto-detect available backends, assign by priority</text>

  <rect x="60" y="250" width="150" height="50" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="135" y="271" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">worker_fast</text>
  <text x="135" y="288" text-anchor="middle" fill="#64748b" font-size="9">Cursor / Kimi / Codex</text>

  <rect x="230" y="250" width="150" height="50" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="305" y="271" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">worker_smart</text>
  <text x="305" y="288" text-anchor="middle" fill="#64748b" font-size="9">Claude / Kimi / Gemini</text>

  <rect x="400" y="250" width="150" height="50" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="475" y="271" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">architect</text>
  <text x="475" y="288" text-anchor="middle" fill="#64748b" font-size="9">Reviews design</text>

  <rect x="570" y="250" width="150" height="50" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="645" y="271" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">tester</text>
  <text x="645" y="288" text-anchor="middle" fill="#64748b" font-size="9">Verifies correctness</text>

  <rect x="740" y="250" width="160" height="50" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="820" y="271" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">browser_tester</text>
  <text x="820" y="288" text-anchor="middle" fill="#64748b" font-size="9">E2E / UI testing</text>

  <!-- Arrow down -->
  <line x1="480" y1="315" x2="480" y2="340" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3: EXECUTION ===== -->
  <rect x="30" y="340" width="900" height="310" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="360" fill="#a5b4fc" font-size="12" font-weight="700">3  STAGE EXECUTION</text>

  <!-- Stage pipeline -->
  <rect x="60" y="375" width="120" height="44" rx="8" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="120" y="393" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Stage 1</text>
  <text x="120" y="409" text-anchor="middle" fill="#ddd6fe" font-size="9">sequential</text>

  <line x1="180" y1="397" x2="210" y2="397" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Parallel group box -->
  <rect x="210" y="368" width="280" height="58" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="350" y="382" text-anchor="middle" fill="#06b6d4" font-size="9" font-weight="600">PARALLEL GROUP 1 (git worktrees)</text>

  <rect x="225" y="388" width="110" height="30" rx="6" fill="url(#cyan)" filter="url(#shadow)"/>
  <text x="280" y="408" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Stage 2</text>

  <rect x="348" y="388" width="110" height="30" rx="6" fill="url(#cyan)" filter="url(#shadow)"/>
  <text x="403" y="408" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Stage 3</text>

  <line x1="490" y1="397" x2="520" y2="397" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="375" width="120" height="44" rx="8" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="580" y="393" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Stage 4</text>
  <text x="580" y="409" text-anchor="middle" fill="#ddd6fe" font-size="9">sequential</text>

  <line x1="640" y1="397" x2="670" y2="397" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="690" y="401" fill="#475569" font-size="10">...</text>

  <!-- Orchestrator cycle detail -->
  <rect x="60" y="440" width="850" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="462" fill="#94a3b8" font-size="12" font-weight="700">ORCHESTRATOR CYCLE (per stage)</text>

  <!-- Cycle loop -->
  <rect x="80" y="478" width="200" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="180" y="498" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">Orchestrator LLM</text>
  <text x="180" y="514" text-anchor="middle" fill="#64748b" font-size="9">Thinks, plans, delegates</text>
  <text x="180" y="528" text-anchor="middle" fill="#64748b" font-size="9">20-30 exchanges/cycle</text>

  <!-- Delegation arrows -->
  <line x1="280" y1="495" x2="330" y2="485" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="505" x2="330" y2="505" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="515" x2="330" y2="525" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent sessions -->
  <rect x="330" y="472" width="140" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="400" y="491" text-anchor="middle" fill="#c7d2fe" font-size="10">Claude Code (SDK)</text>

  <rect x="330" y="508" width="140" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="400" y="527" text-anchor="middle" fill="#c7d2fe" font-size="10">Cursor / Kimi / ...</text>

  <!-- Arrow to project -->
  <line x1="470" y1="505" x2="520" y2="505" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="520" y="482" width="130" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="585" y="502" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Project Files</text>
  <text x="585" y="518" text-anchor="middle" fill="#64748b" font-size="9">git worktree</text>

  <!-- Cycle flow -->
  <rect x="690" y="472" width="200" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="790" y="492" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Cycle Flow</text>
  <text x="790" y="510" text-anchor="middle" fill="#64748b" font-size="10">Cycle 1 → 2 → ... → N</text>
  <text x="790" y="526" text-anchor="middle" fill="#10b981" font-size="10">done? → verify criteria</text>
  <text x="790" y="542" text-anchor="middle" fill="#f59e0b" font-size="10">not done? → summarize → next</text>

  <!-- Context note -->
  <rect x="80" y="548" width="280" height="26" rx="6" fill="#1e293b"/>
  <text x="90" y="565" fill="#475569" font-size="10">Context compressed when > 100k tokens (keep last 50k)</text>

  <!-- Cost note -->
  <rect x="520" y="548" width="370" height="26" rx="6" fill="#1e293b"/>
  <text x="530" y="565" fill="#475569" font-size="10">Orchestrator: ~$0.01 API  |  Agents: $0 (subscription-covered)</text>

  <!-- ===== STEP 4: ADVISOR ===== -->
  <rect x="30" y="665" width="900" height="140" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="685" fill="#a5b4fc" font-size="12" font-weight="700">4  ADAPTIVE ADVISOR (optional)</text>
  <text x="310" y="685" fill="#64748b" font-size="10">Re-assesses after each stage — can generate new stages or finish early</text>

  <!-- Advisor loop -->
  <rect x="60" y="700" width="180" height="50" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="150" y="721" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Stage completed</text>
  <text x="150" y="738" text-anchor="middle" fill="#64748b" font-size="9">+ summary of work done</text>

  <line x1="240" y1="725" x2="310" y2="725" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="700" width="200" height="50" rx="8" fill="url(#orange)" filter="url(#shadow)"/>
  <text x="410" y="721" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Advisor LLM</text>
  <text x="410" y="738" text-anchor="middle" fill="#fff3e0" font-size="9">"Given progress, what's next?"</text>

  <!-- Two outcomes -->
  <line x1="510" y1="715" x2="580" y2="705" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="735" x2="580" y2="745" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="690" width="170" height="32" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
  <text x="665" y="710" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="600">→ Generate next stage</text>

  <rect x="580" y="730" width="170" height="32" rx="6" fill="#14532d" stroke="#10b981" stroke-width="1"/>
  <text x="665" y="750" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">→ "Done" — finish run</text>

  <!-- Loop back arrow -->
  <path d="M 750 706 Q 790 706 790 725 Q 790 770 460 775 Q 90 775 90 755 Q 90 750 115 750" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="800" y="730" fill="#475569" font-size="9">loop</text>

  <text x="770" y="790" fill="#64748b" font-size="9">Safety limit: max 20 stages</text>
</svg>