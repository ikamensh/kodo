<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" /><stop offset="100%" style="stop-color:#4f46e5" />
    </linearGradient>
    <linearGradient id="darkPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81" /><stop offset="100%" style="stop-color:#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4" /><stop offset="100%" style="stop-color:#0891b2" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316" /><stop offset="100%" style="stop-color:#ea580c" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#6366f1">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#475569">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#06b6d4">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="960" height="710" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">Goal Mode</text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">kodo --goal "Add auth middleware to all API routes"</text>

  <!-- ===== STEP 1: INTAKE ===== -->
  <rect x="30" y="80" width="900" height="120" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="100" fill="#a5b4fc" font-size="12" font-weight="700">1  INTAKE / PLANNING</text>

  <rect x="60" y="112" width="180" height="70" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="150" y="138" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">User Goal</text>
  <text x="150" y="156" text-anchor="middle" fill="#818cf8" font-size="10" font-family="monospace">"Add auth middleware"</text>
  <text x="150" y="172" text-anchor="middle" fill="#64748b" font-size="9">--goal / --goal-file / chat</text>

  <line x1="240" y1="147" x2="310" y2="147" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="112" width="220" height="70" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="420" y="133" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">Planning LLM</text>
  <text x="420" y="150" text-anchor="middle" fill="#818cf8" font-size="10">Reads codebase, decomposes goal</text>
  <text x="420" y="167" text-anchor="middle" fill="#64748b" font-size="9">+ parallelism annotation pass</text>

  <line x1="530" y1="147" x2="600" y2="147" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="112" width="300" height="70" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="750" y="133" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">goal-plan.json</text>
  <text x="750" y="150" text-anchor="middle" fill="#818cf8" font-size="10" font-family="monospace">context + stages[]</text>
  <text x="750" y="167" text-anchor="middle" fill="#64748b" font-size="9">{name, description, acceptance_criteria, parallel_group}</text>

  <!-- Arrow down -->
  <line x1="480" y1="200" x2="480" y2="225" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== STEP 2: EXECUTION ===== -->
  <rect x="30" y="225" width="900" height="310" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="245" fill="#a5b4fc" font-size="12" font-weight="700">2  STAGE EXECUTION</text>

  <!-- Stage pipeline -->
  <rect x="60" y="260" width="120" height="44" rx="8" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="120" y="278" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Stage 1</text>
  <text x="120" y="294" text-anchor="middle" fill="#ddd6fe" font-size="9">sequential</text>

  <line x1="180" y1="282" x2="210" y2="282" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Parallel group box -->
  <rect x="210" y="253" width="280" height="58" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="350" y="267" text-anchor="middle" fill="#06b6d4" font-size="9" font-weight="600">PARALLEL GROUP 1 (git worktrees)</text>

  <rect x="225" y="273" width="110" height="30" rx="6" fill="url(#cyan)" filter="url(#shadow)"/>
  <text x="280" y="293" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Stage 2</text>

  <rect x="348" y="273" width="110" height="30" rx="6" fill="url(#cyan)" filter="url(#shadow)"/>
  <text x="403" y="293" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Stage 3</text>

  <line x1="490" y1="282" x2="520" y2="282" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="260" width="120" height="44" rx="8" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="580" y="278" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Stage 4</text>
  <text x="580" y="294" text-anchor="middle" fill="#ddd6fe" font-size="9">sequential</text>

  <line x1="640" y1="282" x2="670" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="690" y="286" fill="#475569" font-size="10">...</text>

  <!-- Orchestrator cycle detail -->
  <rect x="60" y="325" width="850" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="347" fill="#94a3b8" font-size="12" font-weight="700">ORCHESTRATOR CYCLE (per stage)</text>

  <!-- Cycle loop -->
  <rect x="80" y="363" width="200" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="180" y="383" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">Orchestrator LLM</text>
  <text x="180" y="399" text-anchor="middle" fill="#64748b" font-size="9">Thinks, plans, delegates</text>
  <text x="180" y="413" text-anchor="middle" fill="#64748b" font-size="9">up to 30 exchanges/cycle</text>

  <!-- Delegation arrows -->
  <line x1="280" y1="380" x2="330" y2="370" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="390" x2="330" y2="390" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="400" x2="330" y2="410" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent sessions -->
  <rect x="330" y="357" width="140" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="400" y="376" text-anchor="middle" fill="#c7d2fe" font-size="10">Claude Code (SDK)</text>

  <rect x="330" y="393" width="140" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="400" y="412" text-anchor="middle" fill="#c7d2fe" font-size="10">Cursor / Kimi / ...</text>

  <!-- Arrow to project -->
  <line x1="470" y1="390" x2="520" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="520" y="367" width="130" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="585" y="387" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Project Files</text>
  <text x="585" y="403" text-anchor="middle" fill="#64748b" font-size="9">git worktree</text>

  <!-- Cycle flow -->
  <rect x="690" y="357" width="200" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="790" y="377" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Cycle Flow</text>
  <text x="790" y="395" text-anchor="middle" fill="#64748b" font-size="10">Cycle 1 &#x2192; 2 &#x2192; ... &#x2192; N</text>
  <text x="790" y="411" text-anchor="middle" fill="#10b981" font-size="10">done? &#x2192; verify criteria</text>
  <text x="790" y="427" text-anchor="middle" fill="#f59e0b" font-size="10">not done? &#x2192; summarize &#x2192; next</text>

  <!-- Context note -->
  <rect x="80" y="433" width="280" height="26" rx="6" fill="#1e293b"/>
  <text x="90" y="450" fill="#475569" font-size="10">Context compressed when > 100k tokens (keep last 50k)</text>

  <!-- Cost note -->
  <rect x="520" y="433" width="370" height="26" rx="6" fill="#1e293b"/>
  <text x="530" y="450" fill="#475569" font-size="10">Orchestrator: ~$0.01 API  |  Agents: $0 (subscription-covered)</text>

  <!-- Arrow down -->
  <line x1="480" y1="535" x2="480" y2="560" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3: ADVISOR ===== -->
  <rect x="30" y="555" width="900" height="140" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="50" y="575" fill="#a5b4fc" font-size="12" font-weight="700">3  ADAPTIVE ADVISOR (optional)</text>
  <text x="310" y="575" fill="#64748b" font-size="10">Re-assesses after each stage &#x2014; can generate new stages or finish early</text>

  <!-- Advisor loop -->
  <rect x="60" y="590" width="180" height="50" rx="8" fill="url(#darkPurple)" filter="url(#shadow)"/>
  <text x="150" y="611" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Stage completed</text>
  <text x="150" y="628" text-anchor="middle" fill="#64748b" font-size="9">+ summary of work done</text>

  <line x1="240" y1="615" x2="310" y2="615" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="590" width="200" height="50" rx="8" fill="url(#orange)" filter="url(#shadow)"/>
  <text x="410" y="611" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Advisor LLM</text>
  <text x="410" y="628" text-anchor="middle" fill="#fff3e0" font-size="9">"Given progress, what's next?"</text>

  <!-- Two outcomes -->
  <line x1="510" y1="605" x2="580" y2="595" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="625" x2="580" y2="635" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="580" width="170" height="32" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
  <text x="665" y="600" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="600">&#x2192; Generate next stage</text>

  <rect x="580" y="620" width="170" height="32" rx="6" fill="#14532d" stroke="#10b981" stroke-width="1"/>
  <text x="665" y="640" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">&#x2192; "Done" &#x2014; finish run</text>

  <!-- Loop back arrow -->
  <path d="M 750 596 Q 790 596 790 615 Q 790 660 460 665 Q 90 665 90 645 Q 90 640 115 640" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="800" y="620" fill="#475569" font-size="9">loop</text>

  <text x="770" y="680" fill="#64748b" font-size="9">Safety limit: max 20 stages</text>
</svg>
