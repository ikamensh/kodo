<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981" /><stop offset="100%" style="stop-color:#059669" />
    </linearGradient>
    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b" /><stop offset="100%" style="stop-color:#022c22" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6" /><stop offset="100%" style="stop-color:#0d9488" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b" /><stop offset="100%" style="stop-color:#d97706" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444" /><stop offset="100%" style="stop-color:#dc2626" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#10b981">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#475569">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="900" height="700" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">Improve Mode</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">kodo --improve [--focus "auth module"]</text>

  <!-- ===== STEP 1: DISCOVERY ===== -->
  <rect x="30" y="78" width="840" height="90" rx="10" fill="#022c22" stroke="#059669" stroke-width="1" opacity="0.7"/>
  <text x="50" y="98" fill="#6ee7b7" font-size="12" font-weight="700">1  DISCOVERY</text>

  <rect x="60" y="110" width="200" height="44" rx="8" fill="url(#darkGreen)" filter="url(#shadow)"/>
  <text x="160" y="128" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Planning LLM</text>
  <text x="160" y="144" text-anchor="middle" fill="#64748b" font-size="9">Analyze codebase for improvements</text>

  <line x1="260" y1="132" x2="310" y2="132" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="110" width="250" height="44" rx="8" fill="url(#darkGreen)" filter="url(#shadow)"/>
  <text x="435" y="128" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Validated Improve Plan</text>
  <text x="435" y="144" text-anchor="middle" fill="#64748b" font-size="9">3 analysis stages + triage + fix</text>

  <rect x="600" y="110" width="250" height="44" rx="8" fill="#0f2a1e" stroke="#065f46" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="725" y="128" text-anchor="middle" fill="#059669" font-size="11">Optional: --focus "area"</text>
  <text x="725" y="144" text-anchor="middle" fill="#475569" font-size="9">Steers discovery toward specific module</text>

  <!-- ===== STEP 2: PARALLEL ANALYSIS ===== -->
  <rect x="30" y="185" width="840" height="170" rx="10" fill="#022c22" stroke="#059669" stroke-width="1" opacity="0.7"/>
  <text x="50" y="205" fill="#6ee7b7" font-size="12" font-weight="700">2  PARALLEL ANALYSIS</text>
  <text x="240" y="205" fill="#475569" font-size="10">Read-only. Each in isolated git worktree. Do NOT modify source.</text>

  <!-- Parallel group border -->
  <rect x="50" y="218" width="800" height="126" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="70" y="235" fill="#14b8a6" font-size="10" font-weight="600">parallel_group = 1  (concurrent execution)</text>

  <!-- Three analysis boxes -->
  <rect x="70" y="245" width="230" height="88" rx="8" fill="url(#darkGreen)" filter="url(#shadow)" stroke="#10b981" stroke-width="1"/>
  <text x="185" y="267" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Simplification</text>
  <text x="185" y="285" text-anchor="middle" fill="#94a3b8" font-size="10">Unnecessary abstractions</text>
  <text x="185" y="299" text-anchor="middle" fill="#94a3b8" font-size="10">Duplicated logic, dead code</text>
  <text x="185" y="313" text-anchor="middle" fill="#94a3b8" font-size="10">Unused dependencies</text>
  <text x="185" y="328" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">→ findings-simplification.md</text>

  <rect x="320" y="245" width="230" height="88" rx="8" fill="url(#darkGreen)" filter="url(#shadow)" stroke="#10b981" stroke-width="1"/>
  <text x="435" y="267" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Usability</text>
  <text x="435" y="285" text-anchor="middle" fill="#94a3b8" font-size="10">CLI flags, API naming</text>
  <text x="435" y="299" text-anchor="middle" fill="#94a3b8" font-size="10">Error messages, defaults</text>
  <text x="435" y="313" text-anchor="middle" fill="#94a3b8" font-size="10">README accuracy</text>
  <text x="435" y="328" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">→ findings-usability.md</text>

  <rect x="570" y="245" width="260" height="88" rx="8" fill="url(#darkGreen)" filter="url(#shadow)" stroke="#10b981" stroke-width="1"/>
  <text x="700" y="265" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Architecture &amp; Security</text>
  <text x="700" y="283" text-anchor="middle" fill="#94a3b8" font-size="10">Module boundaries, coupling</text>
  <text x="700" y="297" text-anchor="middle" fill="#94a3b8" font-size="10">Circular deps, god modules</text>
  <text x="700" y="311" text-anchor="middle" fill="#94a3b8" font-size="10">Hardcoded secrets, injection</text>
  <text x="700" y="328" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">→ findings-architecture.md</text>

  <!-- Arrow down -->
  <line x1="450" y1="355" x2="450" y2="378" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="370" fill="#475569" font-size="9">merge findings</text>

  <!-- ===== STEP 3: TRIAGE ===== -->
  <rect x="30" y="378" width="840" height="140" rx="10" fill="#022c22" stroke="#059669" stroke-width="1" opacity="0.7"/>
  <text x="50" y="398" fill="#6ee7b7" font-size="12" font-weight="700">3  TRIAGE &amp; VERIFY</text>
  <text x="200" y="398" fill="#475569" font-size="10">Sequential. Skeptically verify each finding. Default to skip.</text>

  <rect x="60" y="412" width="200" height="44" rx="8" fill="url(#darkGreen)" filter="url(#shadow)"/>
  <text x="160" y="430" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">All findings files</text>
  <text x="160" y="446" text-anchor="middle" fill="#64748b" font-size="9">3 analysis reports merged</text>

  <line x1="260" y1="434" x2="310" y2="434" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Triage decisions -->
  <rect x="310" y="410" width="540" height="98" rx="8" fill="#0a2118" stroke="#065f46" stroke-width="1"/>

  <rect x="330" y="425" width="140" height="36" rx="6" fill="url(#green)"/>
  <text x="400" y="440" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">FIX</text>
  <text x="400" y="454" text-anchor="middle" fill="#d1fae5" font-size="9">Safe, clear improvement</text>

  <rect x="490" y="425" width="170" height="36" rx="6" fill="url(#amber)"/>
  <text x="575" y="440" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">NEEDS DECISION</text>
  <text x="575" y="454" text-anchor="middle" fill="#fef3c7" font-size="9">Ambiguous, needs human</text>

  <rect x="680" y="425" width="140" height="36" rx="6" fill="#374151"/>
  <text x="750" y="440" text-anchor="middle" fill="#d1d5db" font-size="12" font-weight="700">SKIP</text>
  <text x="750" y="454" text-anchor="middle" fill="#9ca3af" font-size="9">False positive / low value</text>

  <text x="450" y="498" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">→ triage-results.md</text>

  <!-- Arrow down -->
  <line x1="450" y1="518" x2="450" y2="538" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== STEP 4: FIX & REPORT ===== -->
  <rect x="30" y="538" width="840" height="145" rx="10" fill="#022c22" stroke="#059669" stroke-width="1" opacity="0.7"/>
  <text x="50" y="558" fill="#6ee7b7" font-size="12" font-weight="700">4  FIX &amp; REPORT</text>
  <text x="185" y="558" fill="#475569" font-size="10">Sequential. persist_changes = true</text>

  <!-- Fix actions -->
  <rect x="60" y="572" width="350" height="95" rx="8" fill="url(#darkGreen)" filter="url(#shadow)" stroke="#10b981" stroke-width="1"/>
  <text x="235" y="592" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Agent applies fixes</text>

  <rect x="80" y="602" width="140" height="28" rx="6" fill="#065f46"/>
  <text x="150" y="620" text-anchor="middle" fill="#a7f3d0" font-size="10">Apply "FIX" items</text>

  <rect x="235" y="602" width="160" height="28" rx="6" fill="#78350f"/>
  <text x="315" y="620" text-anchor="middle" fill="#fde68a" font-size="10">Document "NEEDS DECISION"</text>

  <text x="235" y="656" text-anchor="middle" fill="#475569" font-size="9">Runs tests after each fix to verify no regressions</text>

  <line x1="410" y1="619" x2="470" y2="619" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Report output -->
  <rect x="470" y="572" width="380" height="95" rx="8" fill="#0a2118" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="597" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="700" font-family="monospace">improve-report.md</text>
  <line x1="490" y1="608" x2="830" y2="608" stroke="#065f46" stroke-width="1"/>
  <text x="500" y="628" fill="#10b981" font-size="11">Auto-fixed:</text>
  <text x="600" y="628" fill="#94a3b8" font-size="11">[list of applied changes]</text>
  <text x="500" y="648" fill="#f59e0b" font-size="11">Needs decision:</text>
  <text x="620" y="648" fill="#94a3b8" font-size="11">[items for human review]</text>
</svg>