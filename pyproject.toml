[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.2", "pip>=25.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kodo"
version = "0.5.0"
description = "Autonomous multi-agent coding orchestration for CLI and API coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Ilya Kamen" },
]
keywords = [
    "coding-agents",
    "claude-code",
    "codex",
    "cursor",
    "gemini",
    "multi-agent",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28",
    "mcp>=1.0",
    "piicleaner>=0.4.1",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "pydantic-ai-slim[anthropic,google,openai,openrouter]>=1.74",
    "summarization-pydantic-ai>=0.1.4",
    "uvicorn>=0.40",
    "charset-normalizer>=3.4.6",  # pin to suppress deprecation warning on import
    "chardet<6",  # requests 2.x only supports chardet <6; swebench pulls in 7.x
]

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.1.36",
]
codex = []
cursor = []
gemini-cli = []
kimi = [
    "kimi-agent-sdk>=0.0.5",
]
kiro = []
opencode = []
all-agents = [
    "claude-agent-sdk>=0.1.36",
    "kimi-agent-sdk>=0.0.5",
]
api-extra-providers = [
    "pydantic-ai-slim[groq,mistral,xai]>=1.74",
]
test = [
    "build",
    "pytest>=7.0",
    "ruff",
    "twine",
]
benchmark = [
    "datasets>=2.0",
    "swebench>=1.0",
    "google-auth>=2.0",
    "google-cloud-firestore>=2.0",
    "google-cloud-storage>=2.0",
]

[project.urls]
Homepage = "https://github.com/ikamensh/kodo"
Repository = "https://github.com/ikamensh/kodo"
Issues = "https://github.com/ikamensh/kodo/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not slow and not integration'"
markers = [
    "live: tests that call real backends (require local auth, run with: pytest -m live)",
    "slow: git integration tests with real subprocess calls (run with: pytest -m slow)",
    "integration: integration tests (real CLI via subprocess)",
    "real_models: opt out of fast model mock (needs real make_fresh_model)",
]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    "ignore:urllib3.*doesn't match a supported version:requests.exceptions.RequestsDependencyWarning",
    "ignore:You should use:DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.setuptools]
packages = [
    "benchmark",
    "benchmark.online",
    "kodo",
    "kodo.cli",
    "kodo.dashboard",
    "kodo.defaults",
    "kodo.knowledge",
    "kodo.orchestrators",
    "kodo.prompts",
    "kodo.sessions",
    "kodo_workers",
    "kodo_workers.sessions",
]

[tool.setuptools.package-dir]
kodo_workers = "kodo_workers/src/kodo_workers"

[tool.setuptools.package-data]
kodo = [
    "*.html",
    "dashboard/*.css",
    "dashboard/*.html",
    "dashboard/*.js",
    "defaults/*.json",
]
benchmark = [
    "*.md",
    "online/*.md",
    "online/static/*.html",
    "online/static/*.md",
    "subsets/*.json",
]

[project.scripts]
kodo = "kodo.cli:main"
kodo-bench = "benchmark.__main__:main"

[tool.ruff.lint.per-file-ignores]
# Scripts often need sys.path manipulation or other setup before imports; E402 is unfixable.
"scripts/**" = ["E402"]
# CLI needs load_dotenv() before kodo imports (env vars for API keys).
"kodo/cli/_main.py" = ["E402"]
# Launch module suppresses noisy SDK logging before importing kodo modules.
"kodo/cli/_launch.py" = ["E402"]
# Intentional bugs for testing kodo --improve.
"tests/fixtures/buggy_project/**" = ["F821"]

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]
