[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kodo"
version = "0.4.119"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.36",
    "httpx>=0.28",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "pydantic-ai>=1.0",
    "summarization-pydantic-ai>=0.0.3",
    "uvicorn>=0.40",
    "pillow>=12.1.1",
    "pypdf>=6.7.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that call real backends (require local auth, run with: pytest -m live)",
]

[tool.setuptools.packages.find]
include = ["kodo*"]

[tool.setuptools.package-data]
kodo = ["*.html"]

[project.scripts]
kodo = "kodo.cli:main"

[tool.ruff.lint.per-file-ignores]
# Scripts often need sys.path manipulation or other setup before imports; E402 is unfixable.
"scripts/**" = ["E402"]
# CLI needs load_dotenv() before kodo imports (env vars for API keys).
"kodo/cli/_main.py" = ["E402"]
# Launch module suppresses noisy SDK logging before importing kodo modules.
"kodo/cli/_launch.py" = ["E402"]
# Intentional bugs for testing kodo --improve.
"tests/fixtures/buggy_project/**" = ["F821"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
