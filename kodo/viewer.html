<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kodo Log Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Theme variables */
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-inset: #0d1117;
  --border: #30363d; --border-subtle: #21262d; --border-muted: #1c2128;
  --fg: #c9d1d9; --fg-heading: #e6edf3; --fg-muted: #8b949e; --fg-faint: #484f58;
  --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149;
  --purple: #d2a8ff; --blue-light: #79c0ff; --orange: #f0883e;
  --hover: #1c2128; --surface-hover: #161b22;
  --green-bg: rgba(63,185,80,0.08); --green-border: rgba(63,185,80,0.2);
  --red-bg: rgba(248,81,73,0.08); --red-border: rgba(248,81,73,0.2);
  --accent-bg: rgba(88,166,255,0.05); --accent-border: rgba(88,166,255,0.15);
  --muted-bg: rgba(139,148,158,0.05); --muted-border: rgba(139,148,158,0.15);
  --badge-bg: rgba(255,255,255,0.06); --badge-border: rgba(255,255,255,0.06);
  --purple-bg: rgba(210,168,255,0.1); --green-pane-bg: rgba(63,185,80,0.1);
  --tool-bg: rgba(210,153,34,0.05); --session-bg: rgba(255,255,255,0.02); --session-hover: rgba(255,255,255,0.04);
}
:root.light {
  --bg: #ffffff; --bg-surface: #f6f8fa; --bg-inset: #ffffff;
  --border: #d0d7de; --border-subtle: #d8dee4; --border-muted: #e8ecf0;
  --fg: #1f2328; --fg-heading: #1f2328; --fg-muted: #656d76; --fg-faint: #8b949e;
  --accent: #0969da; --green: #1a7f37; --yellow: #9a6700; --red: #cf222e;
  --purple: #8250df; --blue-light: #0550ae; --orange: #bc4c00;
  --hover: #f3f4f6; --surface-hover: #eef1f4;
  --green-bg: rgba(26,127,55,0.08); --green-border: rgba(26,127,55,0.2);
  --red-bg: rgba(207,34,46,0.08); --red-border: rgba(207,34,46,0.2);
  --accent-bg: rgba(9,105,218,0.05); --accent-border: rgba(9,105,218,0.15);
  --muted-bg: rgba(101,109,118,0.05); --muted-border: rgba(101,109,118,0.15);
  --badge-bg: rgba(0,0,0,0.04); --badge-border: rgba(0,0,0,0.06);
  --purple-bg: rgba(130,80,223,0.1); --green-pane-bg: rgba(26,127,55,0.1);
  --tool-bg: rgba(154,103,0,0.05); --session-bg: rgba(0,0,0,0.02); --session-hover: rgba(0,0,0,0.04);
}

body { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; background: var(--bg); color: var(--fg); min-height: 100vh; }

/* Drop zone */
#drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; border: 2px dashed var(--border); margin: 20px; border-radius: 12px; transition: border-color 0.2s; }
#drop-zone.active { border-color: var(--accent); background: var(--accent-bg); }
#drop-zone h2 { color: var(--accent); margin-bottom: 8px; }
#drop-zone p { color: var(--fg-muted); }

/* Stats bar */
#stats-bar { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px 20px; background: var(--bg-surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 14px; font-weight: 600; color: var(--fg-heading); }

/* Timeline */
#timeline { max-width: 1100px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }

/* Header card */
.header-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 8px; }
.header-card h3 { color: var(--accent); margin-bottom: 8px; font-size: 14px; }
.header-card pre { font-size: 11px; color: var(--fg-muted); white-space: pre-wrap; word-break: break-all; }

/* Cycle section */
.cycle-section { margin: 4px 0; }
.cycle-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  user-select: none; transition: background 0.15s; }
.cycle-header:hover { background: var(--hover); }
.cycle-header .toggle { color: var(--fg-muted); font-size: 10px; width: 12px; transition: transform 0.15s; }
.cycle-header.expanded .toggle { transform: rotate(90deg); }
.cycle-header .cycle-title { font-size: 13px; font-weight: 600; color: var(--fg-heading); }
.cycle-header .cycle-meta { font-size: 11px; color: var(--fg-muted); margin-left: auto; display: flex; gap: 10px; }
.cycle-body { display: none; border-left: 2px solid var(--border); margin-left: 16px; padding-left: 12px; padding-top: 4px; }
.cycle-body.visible { display: block; }
.cycle-summary { font-size: 12px; color: var(--fg-muted); padding: 6px 10px; margin: 4px 0;
  background: var(--bg-inset); border-radius: 6px; white-space: pre-wrap; word-break: break-word;
  max-height: 80px; overflow: hidden; position: relative; }

/* Exchange group */
.exchange-group { margin: 6px 0; }
.exchange-header { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px;
  background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: 8px; cursor: pointer;
  user-select: none; transition: background 0.15s; }
.exchange-header:hover { background: var(--surface-hover); }
.exchange-header .toggle { color: var(--fg-muted); font-size: 10px; width: 12px; flex-shrink: 0; margin-top: 3px; transition: transform 0.15s; }
.exchange-header.expanded .toggle { transform: rotate(90deg); }
.exchange-content { flex: 1; min-width: 0; }
.exchange-task { font-size: 12px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exchange-task .agent-label { font-weight: 600; }
.exchange-task .agent-label.planner { color: var(--accent); }
.exchange-task .agent-label.worker { color: var(--green); }
.exchange-task .agent-label.architect { color: var(--yellow); }
.exchange-task .agent-label.orchestrator { color: var(--purple); }
.exchange-response-preview { font-size: 11px; color: var(--fg-muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 700px; }
.exchange-badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.exchange-body { display: none; border-left: 2px solid var(--border-subtle); margin-left: 16px;
  padding-left: 12px; padding-top: 4px; }
.exchange-body.visible { display: block; }

/* Badges */
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--badge-bg);
  color: var(--fg-muted); border: 1px solid var(--badge-border); white-space: nowrap; }
.badge.cost { color: var(--green); }
.badge.tokens { color: var(--purple); }
.badge.time { color: var(--yellow); }
.badge.turns { color: var(--accent); }
.badge.error { color: var(--red); background: var(--red-bg); }
.badge.files { color: var(--yellow); background: var(--tool-bg); }
.badge.new-conv { color: var(--blue-light); }
.badge.ctx-reset { color: var(--orange); }

/* Session query detail */
.session-detail { margin: 6px 0; }
.session-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--session-bg); border: 1px solid var(--border-muted); border-radius: 6px;
  cursor: pointer; user-select: none; font-size: 11px; color: var(--fg-muted); transition: background 0.15s; }
.session-header:hover { background: var(--session-hover); }
.session-header .toggle { font-size: 9px; width: 10px; transition: transform 0.15s; }
.session-header.expanded .toggle { transform: rotate(90deg); }
.session-body { display: none; margin-top: 4px; }
.session-body.visible { display: block; }

/* Prompt / response panes */
.llm-pane { margin: 4px 0; border-radius: 6px; overflow: hidden; }
.llm-pane-header { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 4px 8px; font-weight: 600; cursor: pointer; user-select: none; }
.llm-pane-header.prompt { background: var(--purple-bg); color: var(--purple); border-left: 3px solid var(--purple); }
.llm-pane-header.response { background: var(--green-pane-bg); color: var(--green); border-left: 3px solid var(--green); }
.llm-pane-body { display: none; max-height: 500px; overflow-y: auto; padding: 8px;
  background: var(--bg-inset); border: 1px solid var(--border-muted); border-top: none; font-size: 12px;
  line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--fg); }
.llm-pane-body.visible { display: block; }

/* Tool use list */
.tool-use-list { margin: 4px 0; padding: 6px 8px; background: var(--tool-bg);
  border: 1px solid var(--border-subtle); border-radius: 6px; }
.tool-use-list h4 { font-size: 10px; color: var(--yellow); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.tool-use-item { font-size: 11px; color: var(--fg-muted); padding: 1px 0; }
.tool-use-item .tool-name { color: var(--blue-light); }
.tool-use-item .file-path { color: var(--yellow); }

/* Full text panels in exchange body */
.full-text-section { margin: 6px 0; }
.full-text-section h4 { font-size: 11px; color: var(--fg-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.full-text-content { font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  max-height: 300px; overflow-y: auto; padding: 8px; background: var(--bg-inset);
  border: 1px solid var(--border-muted); border-radius: 6px; }

/* Side events (done, commits, errors) */
.side-event { padding: 6px 10px; margin: 4px 0; border-radius: 6px; font-size: 11px; }
.side-event.done-accepted { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
.side-event.done-rejected { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
.side-event.commit { background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); }
.side-event.error-event { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
.side-event.info-event { background: var(--muted-bg); border: 1px solid var(--muted-border); color: var(--fg-muted); }
.side-event .side-event-label { font-weight: 600; margin-right: 6px; }
.side-event-detail { font-size: 11px; color: var(--fg-muted); white-space: pre-wrap; word-break: break-word;
  max-height: 100px; overflow-y: auto; margin-top: 4px; }

/* Final result */
.result-card { background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 12px; padding: 16px; margin-top: 8px; }
.result-card h3 { color: var(--accent); margin-bottom: 8px; font-size: 14px; }
.result-card .result-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  max-height: 400px; overflow-y: auto; }

/* Log picker */
#picker { max-width: 900px; margin: 0 auto; padding: 20px; }
#picker h2 { color: var(--accent); margin-bottom: 16px; font-size: 16px; }
#picker .day-group { margin-bottom: 16px; }
#picker .day-label { font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.5px;
  padding: 4px 0; margin-bottom: 4px; border-bottom: 1px solid var(--border-subtle); }
#picker .run-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: 8px; margin: 4px 0;
  cursor: pointer; transition: background 0.15s; font-size: 12px; }
#picker .run-row:hover { background: var(--surface-hover); border-color: var(--border); }
#picker .run-id { color: var(--fg-muted); min-width: 80px; flex-shrink: 0; }
#picker .run-project { color: var(--yellow); min-width: 100px; max-width: 160px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
#picker .run-goal { color: var(--fg); flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
#picker .run-status { font-size: 11px; flex-shrink: 0; min-width: 70px; text-align: right; }
#picker .run-status.done { color: var(--green); }
#picker .run-status.partial { color: var(--yellow); }
#picker .run-status.failed { color: var(--red); }
#picker .run-model { color: var(--fg-muted); font-size: 11px; min-width: 60px; flex-shrink: 0; text-align: right; }
#picker .picker-note { font-size: 11px; color: var(--fg-faint); margin-top: 8px; }

/* Top-right controls */
.top-controls { position: fixed; top: 12px; right: 20px; z-index: 200; display: flex; gap: 8px; }
.top-btn { background: var(--border-subtle); color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 12px;
  cursor: pointer; font-family: inherit; display: none; }
.top-btn:hover { background: var(--border); }
#theme-btn { display: inline-block; }

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); }
</style>
</head>
<body>

<div id="drop-zone">
  <h2>kodo Log Viewer</h2>
  <p>Drag &amp; drop a .jsonl log file here</p>
</div>

<div id="picker" style="display:none;"></div>

<div class="top-controls">
  <button id="back-btn" class="top-btn">All runs</button>
  <button id="theme-btn" class="top-btn">Light</button>
</div>

<div id="app" style="display:none;">
  <div id="stats-bar"></div>
  <div id="timeline"></div>
</div>

<script>
let EMBEDDED_DATA = null;
/*__EMBED_MARKER__*/

let EMBEDDED_INDEX = null;
/*__INDEX_MARKER__*/

// -- Helpers --
function formatTime(s) {
  if (s == null) return '';
  if (s < 60) return s.toFixed(1) + 's';
  return Math.floor(s / 60) + 'm ' + (s % 60).toFixed(0) + 's';
}
function formatCost(c) { return c != null ? '$' + c.toFixed(4) : ''; }
function formatTokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n || 0); }
function truncate(s, len) { return s && s.length > len ? s.slice(0, len) + '...' : (s || ''); }

function agentRole(name) {
  if (!name) return '';
  const n = name.toLowerCase();
  if (n.includes('plan')) return 'planner';
  if (n.includes('work') || n.includes('build') || n.includes('implement')) return 'worker';
  if (n.includes('architect') || n.includes('review')) return 'architect';
  return '';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// -- Build tree from flat events --
function buildTree(events) {
  const tree = { header: null, cycles: [], result: null, preEvents: [] };

  // Collect header info
  const init = events.find(e => e.event === 'run_init');
  const args = events.find(e => e.event === 'cli_args');
  const start = events.find(e => e.event === 'run_start');
  tree.header = { init, args, start };

  let currentCycle = null;
  let currentExchange = null;

  for (const e of events) {
    // Skip header events
    if (['run_init', 'cli_args', 'run_start', 'run_end', 'run_resumed', 'debug_run_start'].includes(e.event)) continue;

    // Cycle start — run_cycle and cycle_start are emitted back-to-back for
    // the same cycle.  run_cycle carries metadata (cycle number, max_cycles,
    // goal); cycle_start is the inner orchestrator event.  Only create a new
    // cycle object on the first of the pair.
    if (e.event === 'run_cycle' || e.event === 'cycle_start') {
      if (e.event === 'cycle_start' && currentCycle && currentCycle.exchanges.length === 0 && !currentCycle.end) {
        // Already created by the preceding run_cycle — just merge any extra fields
        if (e.t != null && !currentCycle.startTime) currentCycle.startTime = e.t;
        continue;
      }
      currentCycle = {
        num: e.cycle || (tree.cycles.length + 1),
        maxCycles: e.max_cycles,
        goal: e.goal,
        priorSummary: e.prior_summary,
        startTime: e.t,
        exchanges: [],
        sideEvents: [],
        end: null,
      };
      tree.cycles.push(currentCycle);
      currentExchange = null;
      continue;
    }

    // Lazy-init a cycle for runs without explicit cycle events
    if (!currentCycle) {
      // Only create on events that belong inside a cycle; skip metadata
      if (!e.event.startsWith('orchestrator_') && !e.event.startsWith('agent_') &&
          !e.event.startsWith('session_') && !e.event.startsWith('done_') &&
          e.event !== 'cycle_end') continue;
      currentCycle = { num: 1, exchanges: [], sideEvents: [], end: null };
      tree.cycles.push(currentCycle);
    }

    // Exchange start: orchestrator delegates to agent
    if (e.event === 'orchestrator_tool_call') {
      currentExchange = {
        toolCall: e,
        agentRunStart: null,
        agentRunEnd: null,
        toolResult: null,
        sessions: [],
        sideEvents: [],
      };
      currentCycle.exchanges.push(currentExchange);
      continue;
    }

    if (e.event === 'agent_run_start' && currentExchange) {
      currentExchange.agentRunStart = e;
      continue;
    }

    if (e.event === 'session_query_start' && currentExchange) {
      currentExchange.sessions.push({ start: e, end: null });
      continue;
    }

    if (e.event === 'session_query_end' && currentExchange) {
      // Match to the last unfinished session query
      for (let i = currentExchange.sessions.length - 1; i >= 0; i--) {
        if (!currentExchange.sessions[i].end) {
          currentExchange.sessions[i].end = e;
          break;
        }
      }
      continue;
    }

    if (e.event === 'agent_run_end') {
      if (currentExchange) currentExchange.agentRunEnd = e;
      continue;
    }

    if (e.event === 'orchestrator_tool_result') {
      if (currentExchange) currentExchange.toolResult = e;
      currentExchange = null;
      continue;
    }

    // Cycle end
    if (e.event === 'cycle_end') {
      if (currentCycle) {
        currentCycle.end = e;
        // Carry forward maxCycles from run_start
        if (!currentCycle.maxCycles && start) currentCycle.maxCycles = start.max_cycles;
      }
      currentExchange = null;
      continue;
    }

    // Final result
    if (e.event === 'orchestrator_response') {
      tree.result = e;
      continue;
    }

    // Side events — attach to current exchange if active, else to cycle
    const sideEvent = categorizeSideEvent(e);
    if (sideEvent) {
      if (currentExchange) currentExchange.sideEvents.push(sideEvent);
      else if (currentCycle) currentCycle.sideEvents.push(sideEvent);
      else tree.preEvents.push(sideEvent);
    }
  }

  return tree;
}

function categorizeSideEvent(e) {
  switch (e.event) {
    case 'orchestrator_done':
    case 'orchestrator_done_attempt':
      return { type: 'info-event', label: 'Done attempt', text: e.summary || '', event: e };
    case 'orchestrator_done_accepted':
      return { type: 'done-accepted', label: 'Accepted', text: e.summary || '', event: e };
    case 'orchestrator_done_rejected':
      return { type: 'done-rejected', label: 'Rejected', text: e.rejection || '', event: e };
    case 'done_verification_error':
      return { type: 'error-event', label: 'Verify error', text: `${e.agent}: ${e.error || ''}`, event: e };
    case 'auto_commit_start':
      return { type: 'commit', label: 'Auto-commit', text: `worker: ${e.worker || ''}`, event: e };
    case 'auto_commit_done':
      return { type: 'commit', label: 'Committed', text: e.report || '', event: e };
    case 'auto_commit_error':
      return { type: 'error-event', label: 'Commit error', text: e.error || '', event: e };
    case 'summarize_end':
      return { type: 'info-event', label: 'Summary', text: truncate(e.summary, 200), event: e };
    case 'summarize_error':
      return { type: 'error-event', label: 'Summary error', text: e.error || '', event: e };
    case 'orchestrator_auth_error':
      return { type: 'error-event', label: 'Auth error', text: `${e.provider}: ${e.status_code}`, event: e };
    case 'orchestrator_retry':
      return { type: 'info-event', label: 'Retry', text: `attempt ${e.attempt}, wait ${e.wait_s}s`, event: e };
    case 'orchestrator_fallback':
      return { type: 'info-event', label: 'Fallback', text: `${e.primary} → ${e.fallback}`, event: e };
    case 'agent_crash':
      return { type: 'error-event', label: 'Agent crash', text: `${e.agent}: ${e.error || ''}`, event: e };
    case 'agent_timeout':
      return { type: 'error-event', label: 'Timeout', text: `${e.agent}: ${e.timeout_s}s`, event: e };
    case 'session_reset':
    case 'agent_session_reset':
      return { type: 'info-event', label: 'Context reset', text: e.reason || `${e.session || e.agent}`, event: e };
    case 'stage_start':
      return { type: 'info-event', label: 'Stage', text: `${e.stage_name}: ${e.description || ''}`, event: e };
    case 'stage_end':
      return { type: e.finished ? 'done-accepted' : 'error-event', label: 'Stage end', text: e.summary || e.error || '', event: e };
    default:
      return null;
  }
}

// -- Extract file edits from exchange --
function extractFileEdits(exchange) {
  const edits = [];
  const seen = new Set();
  for (const sq of exchange.sessions) {
    if (!sq.end) continue;
    // Claude tool_uses
    if (sq.end.tool_uses) {
      for (const tu of sq.end.tool_uses) {
        if (['Write', 'Edit', 'MultiEdit'].includes(tu.name) && tu.input && tu.input.file_path) {
          const key = tu.name + ':' + tu.input.file_path;
          if (!seen.has(key)) { seen.add(key); edits.push({ op: tu.name, path: tu.input.file_path }); }
        }
      }
    }
    // Codex/Cursor raw_messages — look for file edits
    if (sq.end.raw_messages) {
      for (const msg of sq.end.raw_messages) {
        // Codex: item.completed with tool outputs
        if (msg.type === 'item.completed' && msg.item) {
          const item = msg.item;
          if (item.type === 'function_call' && item.name) {
            const fp = item.arguments && (item.arguments.file_path || item.arguments.path);
            if (fp) {
              const key = item.name + ':' + fp;
              if (!seen.has(key)) { seen.add(key); edits.push({ op: item.name, path: fp }); }
            }
          }
        }
      }
    }
  }
  return edits;
}

// -- Extract all tool uses from exchange for display --
function extractAllToolUses(exchange) {
  const tools = [];
  for (const sq of exchange.sessions) {
    if (sq.end && sq.end.tool_uses) {
      for (const tu of sq.end.tool_uses) {
        tools.push(tu);
      }
    }
  }
  return tools;
}

// -- Render Stats --
function renderStats(events) {
  const bar = document.getElementById('stats-bar');
  const last = events[events.length - 1];
  const totalTime = last ? last.t : 0;
  let totalCost = 0, exchanges = 0, agents = new Set(), sessionQueries = 0, cycles = 0;
  let apiCost = 0, subCost = 0;
  for (const e of events) {
    if (e.event === 'agent_run_end') {
      totalCost += e.cost_usd || 0;
      exchanges++;
      agents.add(e.agent);
      if (e.cost_bucket === 'api') apiCost += (e.cost_usd || 0);
      else subCost += (e.cost_usd || 0);
    }
    if (e.event === 'orchestrator_response') totalCost += e.cost_usd || 0;
    if (e.event === 'cycle_end') {
      cycles++;
      const c = e.cost_usd || 0;
      if (e.cost_bucket === 'api') apiCost += c; else subCost += c;
    }
    if (e.event === 'session_query_end') sessionQueries++;
  }
  const stats = [
    ['Time', formatTime(totalTime)],
    ['Cost', formatCost(totalCost)],
    ['API', formatCost(apiCost)],
    ['Subscription', formatCost(subCost)],
    ['Cycles', String(cycles || '-')],
    ['Exchanges', String(exchanges)],
    ['LLM Queries', String(sessionQueries)],
    ['Agents', Array.from(agents).join(', ') || 'n/a'],
  ];
  bar.innerHTML = stats.map(([l, v]) =>
    `<div class="stat"><span class="stat-label">${l}</span><span class="stat-value">${v}</span></div>`
  ).join('');
}

// -- Toggle helper --
function makeToggleable(header, body) {
  header.addEventListener('click', () => {
    const expanded = body.classList.toggle('visible');
    header.classList.toggle('expanded', expanded);
  });
}

// -- Lazy text: only populate on first expand --
function lazyText(el, getText) {
  let loaded = false;
  return () => {
    if (!loaded) { el.textContent = getText(); loaded = true; }
  };
}

// -- Render Timeline --
function renderTimeline(tree) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  // Header card
  const h = tree.header;
  if (h.init || h.args || h.start) {
    const card = document.createElement('div');
    card.className = 'header-card';
    let info = '';
    if (h.start) {
      info += `Orchestrator: ${h.start.orchestrator || '?'}  Model: ${h.start.model || '?'}\n`;
      info += `Project: ${h.start.project_dir || h.init?.project_dir || '?'}\n`;
      info += `Max exchanges: ${h.start.max_exchanges || '?'}  Max cycles: ${h.start.max_cycles || '?'}\n`;
      if (h.start.team && typeof h.start.team === 'object' && !Array.isArray(h.start.team)) {
        const labels = {ClaudeSession:'claude code', CursorSession:'cursor', CodexSession:'codex', GeminiCliSession:'gemini cli'};
        info += `Team:\n`;
        for (const [name, d] of Object.entries(h.start.team)) {
          info += `  ${name} (${labels[d.backend] || d.backend || '?'} / ${d.model || '?'})\n`;
        }
      }
    }
    if (h.args?.goal_text) info += `\n--- Goal ---\n${h.args.goal_text}`;
    card.innerHTML = `<h3>Run Configuration</h3>`;
    const pre = document.createElement('pre');
    pre.textContent = info.trim();
    card.appendChild(pre);
    tl.appendChild(card);
  }

  // Pre-cycle side events
  for (const se of tree.preEvents) tl.appendChild(renderSideEvent(se));

  // Cycles
  for (const cycle of tree.cycles) {
    tl.appendChild(renderCycle(cycle));
  }

  // Final result
  if (tree.result) {
    const e = tree.result;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<h3>Final Result</h3>`;
    const text = document.createElement('div');
    text.className = 'result-text';
    text.textContent = e.result_text || '';
    card.appendChild(text);
    const badges = document.createElement('div');
    badges.className = 'badges';
    badges.style.marginTop = '6px';
    let bh = '';
    if (e.cost_usd) bh += `<span class="badge cost">orchestrator ${formatCost(e.cost_usd)}</span>`;
    if (e.num_turns) bh += `<span class="badge turns">${e.num_turns} turns</span>`;
    if (e.is_error) bh += `<span class="badge error">ERROR</span>`;
    badges.innerHTML = bh;
    card.appendChild(badges);
    tl.appendChild(card);
  }
}

function renderCycle(cycle) {
  const section = document.createElement('div');
  section.className = 'cycle-section';

  // Compute cycle stats
  let cycleCost = 0, cycleTime = 0, exchangeCount = cycle.exchanges.length;
  for (const ex of cycle.exchanges) {
    if (ex.agentRunEnd) {
      cycleCost += ex.agentRunEnd.cost_usd || 0;
      cycleTime += ex.agentRunEnd.elapsed_s || 0;
    }
  }
  if (cycle.end) cycleCost += cycle.end.cost_usd || 0;

  const maxCycles = cycle.maxCycles || cycle.end?.max_cycles || '?';
  const finished = cycle.end?.finished;

  const header = document.createElement('div');
  header.className = 'cycle-header';
  header.innerHTML = `<span class="toggle">▶</span>
    <span class="cycle-title">Cycle ${cycle.num}${maxCycles !== '?' ? ' / ' + maxCycles : ''} ${finished ? '✓' : finished === false ? '✗' : ''}</span>
    <span class="cycle-meta">
      <span>${exchangeCount} exchange${exchangeCount !== 1 ? 's' : ''}</span>
      ${cycleCost ? '<span class="badge cost">' + formatCost(cycleCost) + '</span>' : ''}
      ${cycleTime ? '<span class="badge time">' + formatTime(cycleTime) + '</span>' : ''}
    </span>`;

  const body = document.createElement('div');
  body.className = 'cycle-body';

  // Cycle summary
  if (cycle.end?.summary) {
    const sum = document.createElement('div');
    sum.className = 'cycle-summary';
    sum.textContent = cycle.end.summary;
    body.appendChild(sum);
  }

  // Exchanges
  for (const ex of cycle.exchanges) {
    body.appendChild(renderExchange(ex));
  }

  // Side events (done attempts, commits, etc.)
  for (const se of cycle.sideEvents) {
    body.appendChild(renderSideEvent(se));
  }

  makeToggleable(header, body);
  section.appendChild(header);
  section.appendChild(body);

  // Auto-expand if only 1 cycle
  if (true) { // Always start expanded for usability
    body.classList.add('visible');
    header.classList.add('expanded');
  }

  return section;
}

function renderExchange(exchange) {
  const group = document.createElement('div');
  group.className = 'exchange-group';

  const tc = exchange.toolCall;
  const are = exchange.agentRunEnd;
  const role = agentRole(tc?.agent);
  const fileEdits = extractFileEdits(exchange);

  const header = document.createElement('div');
  header.className = 'exchange-header';

  const taskText = tc?.task || '';
  const responsePreview = truncate((are?.response_text || '').replace(/\n/g, ' '), 120);

  let badgesHtml = '';
  if (are?.elapsed_s) badgesHtml += `<span class="badge time">${formatTime(are.elapsed_s)}</span>`;
  if (are?.cost_usd) badgesHtml += `<span class="badge cost">${formatCost(are.cost_usd)}</span>`;
  if (are?.turns) badgesHtml += `<span class="badge turns">${are.turns} turns</span>`;
  if (are?.input_tokens || are?.output_tokens)
    badgesHtml += `<span class="badge tokens">in:${formatTokens(are.input_tokens)} out:${formatTokens(are.output_tokens)}</span>`;
  if (fileEdits.length) badgesHtml += `<span class="badge files">${fileEdits.length} file${fileEdits.length > 1 ? 's' : ''}</span>`;
  if (tc?.new_conversation) badgesHtml += `<span class="badge new-conv">new conv</span>`;
  if (are?.cost_bucket) badgesHtml += `<span class="badge">${are.cost_bucket.replace(/_/g, ' ')}</span>`;
  if (are?.is_error) badgesHtml += `<span class="badge error">ERROR</span>`;
  if (are?.context_reset) badgesHtml += `<span class="badge ctx-reset">ctx reset</span>`;

  header.innerHTML = `<span class="toggle">▶</span>
    <div class="exchange-content">
      <div class="exchange-task"><span class="agent-label ${role}">${escapeHtml(tc?.agent || 'agent')}</span>: ${escapeHtml(truncate(taskText, 120))}</div>
      <div class="exchange-response-preview">${escapeHtml(responsePreview)}</div>
      <div class="exchange-badges badges">${badgesHtml}</div>
    </div>`;

  const body = document.createElement('div');
  body.className = 'exchange-body';

  // Lazy-populate body
  let bodyPopulated = false;
  const originalToggle = () => {
    if (!bodyPopulated) {
      bodyPopulated = true;
      populateExchangeBody(body, exchange, fileEdits);
    }
    const expanded = body.classList.toggle('visible');
    header.classList.toggle('expanded', expanded);
  };
  header.addEventListener('click', originalToggle);

  group.appendChild(header);
  group.appendChild(body);

  // Exchange-level side events
  for (const se of exchange.sideEvents) {
    group.appendChild(renderSideEvent(se));
  }

  return group;
}

function populateExchangeBody(body, exchange, fileEdits) {
  // Full task
  if (exchange.toolCall?.task) {
    const sec = document.createElement('div');
    sec.className = 'full-text-section';
    sec.innerHTML = '<h4>Task</h4>';
    const content = document.createElement('div');
    content.className = 'full-text-content';
    content.textContent = exchange.toolCall.task;
    sec.appendChild(content);
    body.appendChild(sec);
  }

  // Full agent response
  if (exchange.agentRunEnd?.response_text) {
    const sec = document.createElement('div');
    sec.className = 'full-text-section';
    sec.innerHTML = '<h4>Agent Response</h4>';
    const content = document.createElement('div');
    content.className = 'full-text-content';
    content.textContent = exchange.agentRunEnd.response_text;
    sec.appendChild(content);
    body.appendChild(sec);
  }

  // Tool result report (orchestrator_tool_result.report)
  if (exchange.toolResult?.report) {
    const sec = document.createElement('div');
    sec.className = 'full-text-section';
    sec.innerHTML = '<h4>Report to Orchestrator</h4>';
    const content = document.createElement('div');
    content.className = 'full-text-content';
    content.textContent = exchange.toolResult.report;
    sec.appendChild(content);
    body.appendChild(sec);
  }

  // File edits
  if (fileEdits.length) {
    const list = document.createElement('div');
    list.className = 'tool-use-list';
    list.innerHTML = '<h4>Files Edited</h4>' +
      fileEdits.map(f => `<div class="tool-use-item"><span class="file-path">${escapeHtml(f.path)}</span> <span class="tool-name">(${escapeHtml(f.op)})</span></div>`).join('');
    body.appendChild(list);
  }

  // Session queries — the deepest drill-down level
  if (exchange.sessions.length) {
    const sqSec = document.createElement('div');
    sqSec.className = 'full-text-section';
    sqSec.innerHTML = `<h4>LLM Queries (${exchange.sessions.length})</h4>`;
    for (let i = 0; i < exchange.sessions.length; i++) {
      sqSec.appendChild(renderSessionQuery(exchange.sessions[i], i, exchange.sessions.length));
    }
    body.appendChild(sqSec);
  }
}

function renderSessionQuery(sq, index, total) {
  const detail = document.createElement('div');
  detail.className = 'session-detail';

  const s = sq.start;
  const e = sq.end;

  let meta = `Query ${index + 1}/${total}`;
  if (s?.session) meta += ` — ${s.session}`;
  if (s?.model) meta += ` (${s.model})`;
  if (e?.elapsed_s) meta += `  ${formatTime(e.elapsed_s)}`;
  if (e?.input_tokens || e?.output_tokens) meta += `  in:${formatTokens(e?.input_tokens)} out:${formatTokens(e?.output_tokens)}`;
  if (e?.cost_usd) meta += `  ${formatCost(e.cost_usd)}`;

  const header = document.createElement('div');
  header.className = 'session-header';
  header.innerHTML = `<span class="toggle">▶</span><span>${escapeHtml(meta)}</span>`;

  const body = document.createElement('div');
  body.className = 'session-body';

  // Lazy populate
  let populated = false;
  header.addEventListener('click', () => {
    if (!populated) {
      populated = true;

      // Prompt pane
      if (s?.prompt) {
        const pane = document.createElement('div');
        pane.className = 'llm-pane';
        const ph = document.createElement('div');
        ph.className = 'llm-pane-header prompt';
        ph.textContent = `▶ Prompt (${(s.prompt.length / 1024).toFixed(1)}k chars)`;
        const pb = document.createElement('div');
        pb.className = 'llm-pane-body';
        ph.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const vis = pb.classList.toggle('visible');
          ph.textContent = `${vis ? '▼' : '▶'} Prompt (${(s.prompt.length / 1024).toFixed(1)}k chars)`;
          if (vis && !pb.textContent) pb.textContent = s.prompt;
        });
        pane.appendChild(ph);
        pane.appendChild(pb);
        body.appendChild(pane);
      }

      // Response pane
      const respText = e?.response_text || '';
      if (respText) {
        const pane = document.createElement('div');
        pane.className = 'llm-pane';
        const rh = document.createElement('div');
        rh.className = 'llm-pane-header response';
        rh.textContent = `▶ Response (${(respText.length / 1024).toFixed(1)}k chars)`;
        const rb = document.createElement('div');
        rb.className = 'llm-pane-body';
        rh.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const vis = rb.classList.toggle('visible');
          rh.textContent = `${vis ? '▼' : '▶'} Response (${(respText.length / 1024).toFixed(1)}k chars)`;
          if (vis && !rb.textContent) rb.textContent = respText;
        });
        pane.appendChild(rh);
        pane.appendChild(rb);
        body.appendChild(pane);
      }

      // Tool uses from this session query
      if (e?.tool_uses && e.tool_uses.length) {
        const list = document.createElement('div');
        list.className = 'tool-use-list';
        list.innerHTML = '<h4>Tool Uses</h4>' +
          e.tool_uses.map(tu => {
            const fp = tu.input?.file_path ? ` <span class="file-path">${escapeHtml(tu.input.file_path)}</span>` : '';
            return `<div class="tool-use-item"><span class="tool-name">${escapeHtml(tu.name)}</span>${fp}</div>`;
          }).join('');
        body.appendChild(list);
      }
    }

    const expanded = body.classList.toggle('visible');
    header.classList.toggle('expanded', expanded);
  });

  detail.appendChild(header);
  detail.appendChild(body);
  return detail;
}

function renderSideEvent(se) {
  const el = document.createElement('div');
  el.className = `side-event ${se.type}`;
  el.innerHTML = `<span class="side-event-label">${escapeHtml(se.label)}</span>${escapeHtml(truncate(se.text, 200))}`;
  if (se.text && se.text.length > 200) {
    const detail = document.createElement('div');
    detail.className = 'side-event-detail';
    detail.textContent = se.text;
    detail.style.display = 'none';
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
    });
    el.appendChild(detail);
  }
  return el;
}

// -- Load --
function loadEvents(events) {
  showLogView(events);
}

// Drag and drop (works from any view)
const dz = document.getElementById('drop-zone');
document.body.addEventListener('dragover', e => { e.preventDefault(); if (dz.style.display !== 'none') dz.classList.add('active'); });
document.body.addEventListener('dragleave', e => { if (!e.relatedTarget || e.relatedTarget === document.documentElement) dz.classList.remove('active'); });
document.body.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.trim().split('\n');
    const events = [];
    for (const l of lines) { try { events.push(JSON.parse(l)); } catch(e) {} }
    document.title = 'kodo: ' + file.name;
    loadEvents(events);
  };
  reader.readAsText(file);
});

// Click to select file (only on drop zone)
dz.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.jsonl';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = ev.target.result.trim().split('\n');
      const events = [];
      for (const l of lines) { try { events.push(JSON.parse(l)); } catch(e) {} }
      document.title = 'kodo: ' + file.name;
      loadEvents(events);
    };
    reader.readAsText(file);
  };
  input.click();
});

// -- Log Picker --
function renderPicker(runs) {
  const picker = document.getElementById('picker');
  picker.style.display = 'block';
  document.getElementById('drop-zone').style.display = 'none';

  // Group by day
  const groups = {};
  for (const r of runs) {
    // run_id format: YYYYMMDD_HHMMSS
    const day = formatRunDay(r.run_id);
    if (!groups[day]) groups[day] = [];
    groups[day].push(r);
  }

  let html = '<h2>kodo Log Viewer</h2>';
  for (const [day, dayRuns] of Object.entries(groups)) {
    html += `<div class="day-group">`;
    html += `<div class="day-label">${escapeHtml(day)}</div>`;
    for (const r of dayRuns) {
      const time = formatRunTime(r.run_id);
      const status = r.finished ? 'done' : (r.completed_cycles > 0 ? 'partial' : 'failed');
      const statusText = r.finished ? 'done' : `cycle ${r.completed_cycles}/${r.max_cycles}`;
      const goalSnippet = (r.goal || '').replace(/\n/g, ' ').slice(0, 100);
      const modelShort = (r.model || '').replace(/^(claude-|gemini-)/, '').split('-').slice(0, 2).join('-');
      html += `<div class="run-row" data-run-id="${escapeHtml(r.run_id)}" data-log-file="${escapeHtml(r.log_file || '')}">`;
      html += `<span class="run-id">${escapeHtml(time)}</span>`;
      html += `<span class="run-project">${escapeHtml(r.project_name || '?')}</span>`;
      html += `<span class="run-goal">${escapeHtml(goalSnippet)}</span>`;
      html += `<span class="run-status ${status}">${escapeHtml(statusText)}</span>`;
      html += `<span class="run-model">${escapeHtml(modelShort)}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `<p class="picker-note">Drag &amp; drop a .jsonl file anywhere to open it directly</p>`;
  picker.innerHTML = html;

  // Click handlers
  picker.querySelectorAll('.run-row').forEach(row => {
    row.addEventListener('click', () => {
      const runId = row.dataset.runId;
      loadRunById(runId);
    });
  });
}

const _RUN_ID_RE = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})$/;
const _MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function formatRunDay(runId) {
  // YYYYMMDD_HHMMSS → "Feb 23, 2026"; non-standard → "Other"
  const m = _RUN_ID_RE.exec(runId || '');
  if (!m) return 'Other';
  const mi = parseInt(m[2], 10) - 1;
  return `${_MONTHS[mi] || m[2]} ${parseInt(m[3], 10)}, ${m[1]}`;
}

function formatRunTime(runId) {
  // YYYYMMDD_HHMMSS → "17:26"; non-standard → the run_id itself
  const m = _RUN_ID_RE.exec(runId || '');
  if (!m) return runId || '?';
  return m[4] + ':' + m[5];
}

function loadRunById(runId) {
  // Try fetching via API (works in --serve mode)
  fetch('/api/log/' + encodeURIComponent(runId))
    .then(resp => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.text();
    })
    .then(text => {
      const lines = text.trim().split('\n');
      const events = [];
      for (const line of lines) {
        try { events.push(JSON.parse(line)); } catch (e) {}
      }
      document.title = 'kodo: ' + runId;
      showLogView(events);
    })
    .catch(() => {
      // file:// mode — can't fetch. Rebuild with this log embedded.
      // Show the log file path so user can open it manually.
      const run = EMBEDDED_INDEX && EMBEDDED_INDEX.find(r => r.run_id === runId);
      if (run && run.log_file) {
        alert('To view this log, run:\n\npython -m kodo.viewer "' + run.log_file + '"\n\nOr use --serve mode for in-browser browsing:\npython -m kodo.viewer --serve');
      }
    });
}

function showLogView(events) {
  document.getElementById('picker').style.display = 'none';
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (EMBEDDED_INDEX) document.getElementById('back-btn').style.display = 'inline-block';
  renderStats(events);
  const tree = buildTree(events);
  renderTimeline(tree);
}

function showPicker() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('picker').style.display = 'block';
}

// Back button
document.getElementById('back-btn').addEventListener('click', showPicker);

// Theme toggle
const themeBtn = document.getElementById('theme-btn');
function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  themeBtn.textContent = light ? 'Dark' : 'Light';
  try { localStorage.setItem('kodo-theme', light ? 'light' : 'dark'); } catch(e) {}
}
themeBtn.addEventListener('click', () => {
  applyTheme(!document.documentElement.classList.contains('light'));
});
// Restore saved preference (default: light)
try {
  const saved = localStorage.getItem('kodo-theme');
  applyTheme(saved !== 'dark');
} catch(e) { applyTheme(true); }

// Auto-load embedded data or show picker
if (EMBEDDED_DATA) {
  try {
    loadEvents(EMBEDDED_DATA);
  } catch (err) {
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('stats-bar').innerHTML = '<div class="stat"><span class="stat-label">Error</span><span class="stat-value" style="color:#f85149">' + String(err).replace(/</g, '&lt;') + '</span></div>';
    document.getElementById('timeline').innerHTML = '<div class="header-card"><h3>Parse Error</h3><pre>' + String(err).replace(/</g, '&lt;') + '</pre></div>';
  }
} else if (EMBEDDED_INDEX && EMBEDDED_INDEX.length > 0) {
  renderPicker(EMBEDDED_INDEX);
}
